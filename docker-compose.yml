services:
  web:
    image: webdocto:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11.13-slim-bookworm}
        APP_VERSION: ${APP_VERSION:-1.0.0}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
        PIP_VERSION: ${PIP_VERSION:-25.1.1}
    container_name: webdocto-${APP_VERSION:-1.0.0}
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      WEBDOCTO_SECRET: ${WEBDOCTO_SECRET:-change-me-in-production}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n.sahapat.com:5678/webhook/WebDocToFolw}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://127.0.0.1:8000}
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_JAVASCRIPT_ORIGIN: ${GOOGLE_JAVASCRIPT_ORIGIN:-http://127.0.0.1:8000}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8000/login/oauth2/code/google}
      GOOGLE_LOGIN_URL: ${GOOGLE_LOGIN_URL:-http://127.0.0.1:8000/#login-google}
      GOOGLE_LOGIN_SUCCESS_URL: ${GOOGLE_LOGIN_SUCCESS_URL:-http://127.0.0.1:8000/#dashboard}
      GOOGLE_ADMIN_EMAIL_LIST: ${GOOGLE_ADMIN_EMAIL_LIST:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
